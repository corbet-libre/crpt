[package]
name = "crpt"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Crypto payment adapters and x402 support with minimal gate evidence"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/crpt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[features]
default = []
http = ["dep:reqwest", "dep:url"]
hosted = ["cpmt/providers"]

[dependencies]
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main" }
async-trait = "0.1"
x402-types = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.23"
zeroize = "1"
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"], optional = true }
url = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
